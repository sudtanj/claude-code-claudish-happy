services:
  agent:
    build: .
    image: claude-code-claudish-happy
    # Default command runs Claude Code (via Happy) in the background inside
    # a detached tmux session and keeps the container itself running
    # indefinitely (restart: unless-stopped below) - so `docker compose up
    # -d` alone gives you a persistent session you connect to later from
    # the Happy app, no separate service needed. Override the command for
    # one-off interactive use instead, e.g.:
    #   docker compose run --rm agent claude
    #   docker compose run --rm agent claudish --model openrouter@deepseek/deepseek-r1
    #   docker compose run --rm agent happy claude
    #   docker compose run --rm agent claudish-happy --model openrouter@deepseek/deepseek-r1
    #   docker compose run --rm agent bash
    command: ["background", "happy", "claude"]
    restart: unless-stopped
    # No stdin_open/tty here on purpose: `docker compose run` already
    # allocates a pty itself when invoked from a real terminal, and NOT
    # hardcoding it here means this file stays deployable as-is by
    # orchestrators that never attach a terminal at all (Portainer, `docker
    # compose up -d`, etc.) - it simply runs headless there instead of
    # erroring on an interactive requirement it can't satisfy.
    volumes:
      - .:/workspace
      # Persist each CLI's local config/auth across container restarts.
      - claude-config:/home/agent/.claude
      - claudish-config:/home/agent/.claudish
      - happy-config:/home/agent/.happy
    env_file:
      # Copy .env.example to .env and fill in the keys the CLI you're
      # running actually needs - the entrypoint checks for them and will
      # fail fast with a clear message if a required one is missing.
      - .env
    environment:
      # Uncomment/override any of these here instead of (or on top of) .env:
      # ANTHROPIC_API_KEY: sk-ant-...
      # OPENROUTER_API_KEY: sk-or-v1-...
      # GEMINI_API_KEY: ...
      # OPENAI_API_KEY: sk-...
      # OLLAMA_HOST: http://host.docker.internal:11434
      # CUSTOM_OPENAI_BASE_URL: http://gpu-box:8000/v1
      # CUSTOM_OPENAI_API_KEY: sk-...
      # CUSTOM_ANTHROPIC_BASE_URL: https://my-anthropic-gateway.internal
      # CUSTOM_ANTHROPIC_API_KEY: sk-ant-...
      # CLAUDISH_PORT: 3000
      # Happy needs no key to START: if unpaired, the entrypoint runs
      # pairing itself (QR code/link) before Claude Code/Claudish start,
      # then prints a HAPPY_CREDENTIALS_B64 value and exits instead of
      # starting a real session nobody can reach - paste that here and
      # restart (see README.md). Pair once via
      # `docker compose run --rm agent happy claude` (needs a real
      # terminal) BEFORE relying on `docker compose up -d`'s background
      # default, which has nowhere to show you the pairing QR/link.
      # HAPPY_CREDENTIALS_B64: ...
      # Only set these if self-hosting Happy's own server:
      # HAPPY_SERVER_URL: https://your-happy-server.internal
      # HAPPY_WEBAPP_URL: https://your-happy-webapp.internal
      TERM: xterm-256color

volumes:
  claude-config:
  claudish-config:
  happy-config:
