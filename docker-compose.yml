x-agent-common: &agent-common
  volumes:
    - .:/workspace
    # Persist each CLI's local config/auth across container restarts.
    - claude-config:/home/agent/.claude
    - claudish-config:/home/agent/.claudish
    - happy-config:/home/agent/.happy
  env_file:
    # Copy .env.example to .env and fill in the keys the CLI you're
    # running actually needs - the entrypoint checks for them and will
    # fail fast with a clear message if a required one is missing.
    - .env
  environment:
    # Uncomment/override any of these here instead of (or on top of) .env:
    # ANTHROPIC_API_KEY: sk-ant-...
    # OPENROUTER_API_KEY: sk-or-v1-...
    # GEMINI_API_KEY: ...
    # OPENAI_API_KEY: sk-...
    # OLLAMA_HOST: http://host.docker.internal:11434
    # CUSTOM_OPENAI_BASE_URL: http://gpu-box:8000/v1
    # CUSTOM_OPENAI_API_KEY: sk-...
    # CUSTOM_ANTHROPIC_BASE_URL: https://my-anthropic-gateway.internal
    # CUSTOM_ANTHROPIC_API_KEY: sk-ant-...
    # CLAUDISH_PORT: 3000
    # Happy needs no key to START: if unpaired, the entrypoint runs
    # pairing itself (QR code/link) before Claude Code/Claudish start,
    # then prints a HAPPY_CREDENTIALS_B64 value and exits - paste that
    # here and re-run (see README.md). Required for `agent-daemon` below
    # to actually reach a running session on its first start - pair via
    # `agent` first, THEN switch to `agent-daemon`.
    # HAPPY_CREDENTIALS_B64: ...
    # Only set these if self-hosting Happy's own server:
    # HAPPY_SERVER_URL: https://your-happy-server.internal
    # HAPPY_WEBAPP_URL: https://your-happy-webapp.internal
    TERM: xterm-256color

services:
  # One-off / interactive use: `docker compose run --rm agent <command>`.
  # Exits when you exit the command (or your terminal disconnects).
  agent:
    <<: *agent-common
    build: .
    image: claude-code-claudish-happy
    # Default command is `claude`; override per `docker compose run` invocation, e.g.:
    #   docker compose run --rm agent claudish --model openrouter@deepseek/deepseek-r1
    #   docker compose run --rm agent happy claude
    #   docker compose run --rm agent claudish-happy --model openrouter@deepseek/deepseek-r1
    #   docker compose run --rm agent bash
    command: ["claude"]
    stdin_open: true
    tty: true

  # Persistent / background use: `docker compose up -d agent-daemon`. Runs
  # Claude Code (via Happy) inside a detached tmux session and keeps the
  # container itself running indefinitely, so you can connect from the
  # Happy app later without anything attached locally. Pair Happy once via
  # the `agent` service first (see HAPPY_CREDENTIALS_B64 above) - an
  # unpaired agent-daemon exits its tmux pane almost immediately after
  # printing the pairing QR/link nobody's watching.
  #
  # Peek at it locally any time with:
  #   docker compose exec agent-daemon tmux attach -t happy
  # (Ctrl-b d to detach without stopping it.)
  agent-daemon:
    <<: *agent-common
    build: .
    image: claude-code-claudish-happy
    command: ["background", "happy", "claude"]
    restart: unless-stopped

volumes:
  claude-config:
  claudish-config:
  happy-config:
