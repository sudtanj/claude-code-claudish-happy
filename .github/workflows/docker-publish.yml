name: Build and push Docker image

# On every push to a tracked branch: auto-bump a semver git tag (patch by
# default), then build the image and push it to Docker Hub as both
# ":latest" and ":<the new tag>".
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  - Docker Hub username
#   DOCKERHUB_TOKEN     - Docker Hub access token (Account Settings ->
#                          Security -> Personal access tokens; needs
#                          Read & Write scope)
#
# Also requires the repo's default GITHUB_TOKEN to have write access, so
# the auto-tag step can push the new tag: Settings -> Actions -> General ->
# Workflow permissions -> "Read and write permissions".
on:
  push:
    branches:
      - main
      # Remove this once `main` exists and is the real default branch -
      # kept for now because this repo's default branch is still
      # claude/gracious-ptolemy-p7fr2n.
      - claude/gracious-ptolemy-p7fr2n
  workflow_dispatch: {}

env:
  DOCKERHUB_IMAGE: sudtanj/claude-code-claudish-happy

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Auto-bump version tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # linux/amd64 only for now: this image's full dev toolchain
          # (build-essential, JDK, Go, Rust, Deno, ...) makes a QEMU-emulated
          # arm64 build slow enough to risk CI timeouts. Add
          # ",linux/arm64" here if you need arm64 images and are fine with
          # a much longer build.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag_version.outputs.new_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
